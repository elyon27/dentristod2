name: Import original website assets once
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-original-assets.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/import-original-assets.py
      - run: npm test && npm run build
      - name: Commit verified original assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site
          if ! git diff --cached --quiet; then
            git commit -m 'Import hash-verified original website assets'
            git push origin HEAD:main
          fi
