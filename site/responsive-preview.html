<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsive layout preview</title><style>body{font:16px Arial;background:#eee;margin:16px}iframe{display:block;background:white;border:1px solid #555;height:850px;margin-top:12px}button{padding:12px;margin:4px}</style><h1>Responsive layout preview</h1><p>Preview the website at common CSS screen widths.</p><div id="controls"></div><iframe title="Website preview" id="preview" src="./index.html" width="390"></iframe><script>for(const w of [320,375,390,768,1024,1440]){const b=document.createElement("button");b.textContent=w+" px";b.onclick=()=>document.getElementById("preview").width=w;document.getElementById("controls").append(b)}</script></html>
